<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support — Sudoku Classic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f2f0e9;
            color: #2c2c2e;
            line-height: 1.7;
            min-height: 100vh;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 4rem 1.5rem 6rem;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2.2rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .app-name {
            font-size: 0.95rem;
            color: #8a8780;
            margin-bottom: 3rem;
            letter-spacing: 0.02em;
        }

        h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.25rem;
            font-weight: 400;
            margin-top: 2.5rem;
            margin-bottom: 0.75rem;
            color: #1a1a1a;
        }

        p {
            margin-bottom: 1rem;
            font-size: 0.95rem;
            color: #3a3a3c;
        }

        a {
            color: #b08030;
            text-decoration: none;
            border-bottom: 1px solid rgba(176, 128, 48, 0.3);
            transition: border-color 0.2s;
        }

        a:hover {
            border-bottom-color: #b08030;
        }

        .email-block {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            text-align: center;
        }

        .email-block p {
            color: #8a8780;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .email-block a {
            font-size: 1.1rem;
            font-weight: 500;
            color: #b08030;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: #d4d0c8;
            margin: 3rem 0;
            border: none;
        }

        .footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid #d4d0c8;
            font-size: 0.85rem;
            color: #8a8780;
        }

        .nav {
            font-size: 0.85rem;
            color: #8a8780;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Support</h1>
        <p class="app-name">Sudoku — Classic</p>

        <p>Having trouble with the app, found a bug, or just want to share feedback? I'd love to hear from you.</p>

        <div class="email-block">
            <p>Send me an email at</p>
            <a href="mailto:sudoku.w.support@proton.me">sudoku.w.support@proton.me</a>
        </div>



        <div class="footer">
            <p>&copy; 2026 Pavlo Hurin. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
